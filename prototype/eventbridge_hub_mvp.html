function renderCustomer(){const approved=data.vendors.filter(v=>v.approved);const shown=approved.filter(v=>(filter==='All'||v.category===filter)&&(v.name+' '+v.description+' '+v.city).toLowerCase().includes(search.toLowerCase()));const categories=['All',...new Set(approved.map(v=>v.category))];$('appMain').innerHTML=`<div class="hero"><div><div class="eyebrow on-dark">✦ Your whole celebration, one hub</div><h1>Bring every piece<br/>of your event <span class="sparkle">together.</span></h1><p>Discover trusted-style event partners, create your wishlist, and manage your celebration in one shared space.</p><div class="hero-actions"><button class="btn btn-primary" onclick="document.getElementById('requestForm').scrollIntoView({behavior:'smooth'})">Create an event request →</button><button class="btn" style="color:white;border:1px solid #77709b;background:transparent" onclick="document.getElementById('vendorDirectory').scrollIntoView({behavior:'smooth'})">Explore vendors</button></div></div><div class="hero-orbs"><div class="floating-ticket"><div class="ticket-top"><span class="ticket-emoji">🎉</span><div><strong style="font-size:16px;display:block">A day to remember</strong><span style="color:#9693aa;font-size:12px">Everything in one place</span></div></div><div class="ticket-bars"><div class="ticket-bar"></div><div class="ticket-bar"></div><div class="ticket-bar"></div></div><span class="ticket-floating one">✨ 8 local partners</span><span class="ticket-floating two">✓ Quotes made simple</span></div></div></div>
<div class="features-strip"><div class="feature"><div class="feature-icon">🔎</div><div><b>Discover vendors</b><span>Find everything for your event</span></div></div><div class="feature"><div class="feature-icon">🗂️</div><div><b>Build your package</b><span>Save the vendors you love</span></div></div><div class="feature"><div class="feature-icon">💬</div><div><b>Coordinate in one place</b><span>Review quotes and proposals</span></div></div></div>
<section class="section" id="vendorDirectory"><div class="section-head"><div><div class="eyebrow">THE MARKETPLACE</div><h2>Find your perfect partners</h2><p>Sample event businesses, designed to demonstrate the experience.</p></div><span class="status">${approved.length} demo vendors</span></div><div class="catalogue-tools"><input class="field search-input" id="search" aria-label="Search vendors" placeholder="Search vendors or locations..." value="${esc(search)}" oninput="updateSearch(this.value)" /></div><div class="filters">${categories.map(c=>`<button class="filter-btn ${filter===c?'active':''}" onclick="chooseFilter('${c}')">${esc(c)}</button>`).join('')}</div><div class="dashboard-layout"><div id="vendorGrid" class="vendor-grid">${shown.map(vendorCard).join('')||'<div class="empty">No matching vendors</div>'}</div><aside class="panel" style="align-self:start;position:sticky;top:92px"><div class="eyebrow">YOUR SHORTLIST</div><h3 style="font-size:19px">Saved for your event <span style="color:#8176b1">(${shortlist.length})</span></h3>${shortlist.length?`<div class="selected-list">${shortlist.map(id=>{let v=vendor(id);return `<div class="selected-item"><div><b>${esc(v.name)}</b><span>${esc(v.category)} · from ${money(v.price)}</span></div><button class="remove-x" title="Remove vendor" aria-label="Remove ${esc(v.name)}" onclick="toggleShortlist('${v.id}')">×</button></div>`}).join('')}</div>`:'<div class="empty"><div class="empty-icon">♡</div><b>No vendors saved yet</b><p>Browse the marketplace and select a few favorites.</p></div>'}<p class="aside-note">Shortlisting does not reserve equipment or confirm availability.</p><button class="btn btn-primary" style="width:100%;margin-top:13px" onclick="document.getElementById('requestForm').scrollIntoView({behavior:'smooth'})">Continue to event details →</button></aside></div></section>
<section class="section" id="requestForm"><div class="section-head"><div><div class="eyebrow">STEP 2: TELL US ABOUT IT</div><h2>Create your event request</h2><p>A planner can use these details to build an event package.</p></div></div><form class="panel" onsubmit="submitEventRequest(event)" style="max-width:840px"><div class="field-row"><div class="input-group"><label for="eventTitle">Event name *</label><input id="eventTitle" class="field" placeholder="e.g., Olivia's 5th Birthday" required maxlength="80" /></div><div class="input-group"><label for="eventType">Event type *</label><select id="eventType" required><option value="">Choose one</option>${['Birthday Party','Wedding','Baby Shower','School Event','Church Event','Corporate Event','Other'].map(c=>`<option>${c}</option>`).join('')}</select></div><div class="input-group"><label for="eventDate">Event date *</label><input type="date" id="eventDate" class="field" required /></div><div class="input-group"><label for="eventCity">City / location *</label><input id="eventCity" class="field" placeholder="Raleigh, NC" required maxlength="90" /></div><div class="input-group"><label for="eventGuests">Number of guests *</label><input id="eventGuests" class="field" type="number" min="1" max="10000" value="25" required /></div><div class="input-group"><label for="eventBudget">Approximate budget (USD) *</label><input id="eventBudget" class="field" type="number" min="50" step="50" value="1000" required /></div></div><div class="input-group"><label>Services you need</label><div class="check-row">${categories.filter(c=>c!=='All').map(c=>`<label class="check-chip"><input type="checkbox" name="services" value="${esc(c)}" ${shortlist.some(id=>vendor(id).category===c)?'checked':''}/> ${esc(c)}</label>`).join('')}</div></div><div class="input-group"><label for="eventEmail">Contact email *</label><input id="eventEmail" class="field" type="email" placeholder="you@example.com" maxlength="120" required /></div><div class="input-group"><label for="eventNotes">Additional notes (optional)</label><textarea id="eventNotes" maxlength="750" placeholder="Tell us about your venue, setup preferences, theme or special requirements..."></textarea></div><p class="footnote">This is a local demonstration. Nothing is emailed, no reservations are made, and no personal details are sent to a server. Use sample information.</p><button type="submit" class="btn btn-primary">Submit demo event request →</button></form></section>
<section class="section" id="customerEvents"><div class="section-head"><div><div class="eyebrow">YOUR EVENTS</div><h2>Track the plan</h2><p>Your demo event requests and quote updates appear here.</p></div></div>${data.events.length?`<div class="vendor-grid">${data.events.map(e=>{const total=Object.values(e.quotes).filter(q=>q.status==='quoted').reduce((s,q)=>s+Number(q.amount),0);return `<div class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><span class="tiny-label">${esc(e.id)}</span><span class="status ${e.status==='Proposal shared'?'shared':''}">${esc(e.status)}</span></div><h3 style="margin-top:12px">${esc(e.title)}</h3><p style="font-size:12px">${esc(e.type)} · ${esc(prettyDate(e.date))} · ${esc(e.city)}</p><div class="quote-summary"><strong>${Object.values(e.quotes).filter(q=>q.status==='quoted').length} quote(s) received</strong><br/><span class="muted-small">${e.status==='Proposal shared'?'Proposal subtotal: '+money(total):'A planner can assemble your package.'}</span></div><button class="btn btn-soft btn-small" onclick="openCustomerEvent('${e.id}')">View event details →</button></div>`}).join('')}</div>`:'<div class="empty"><b>No event requests yet.</b><p>Create your first request above.</p></div>'}</section>`}
function submitEventRequest(ev){ev.preventDefault();const v=(id)=>$(id).value.trim();const selectedServices=[...document.querySelectorAll('input[name=services]:checked')].map(x=>x.value);const id='EB-'+String(Date.now()).slice(-8);const e={id,title:v('eventTitle'),type:v('eventType'),date:v('eventDate'),city:v('eventCity'),guests:Number(v('eventGuests')),budget:Number(v('eventBudget')),email:v('eventEmail'),details:v('eventNotes'),services:selectedServices,selectedVendors:[...shortlist],quotes:{},status:'New',createdAt:new Date().toISOString()};data.events.unshift(e);selectedEventId=id;persist();shortlist=[];renderCustomer();$('customerEvents').scrollIntoView({behavior:'smooth'});notify('Demo request created! Open Planner to coordinate vendors.')}
function openCustomerEvent(id){const e=data.events.find(x=>x.id===id);if(!e)return;const rows=e.selectedVendors.map(vid=>{const v=vendor(vid),q=e.quotes[vid];if(!v)return '';const visible=e.status==='Proposal shared';return `<div class="quote-row"><div><strong>${esc(v.name)}</strong><small>${esc(v.category)}</small></div><span class="pill-number">${visible&&q?.status==='quoted'?money(q.amount):'—'}</span><span class="status ${visible&&q?.status==='quoted'?'quoted':'requested'}">${visible&&q?.status==='quoted'?'In proposal':'Pending proposal'}</span></div>`}).join('');const total=Object.values(e.quotes).filter(q=>q.status==='quoted').reduce((s,q)=>s+Number(q.amount),0);$('appMain').innerHTML=`<button class="back-link" onclick="renderCustomer()">← Back to events</button><section class="panel" style="max-width:760px;margin-top:18px"><div class="eyebrow">EVENT ${esc(e.id)}</div><div class="workspace-top"><h2>${esc(e.title)}</h2><span class="status ${e.status==='Proposal shared'?'shared':''}">${esc(e.status)}</span></div><p>${esc(prettyDate(e.date))} · ${esc(e.city)} · ${e.guests} guests · Budget ${money(e.budget)}</p><hr class="divider"/><h3>Your selected services</h3><p>${esc(e.services.join(', ')||'Not specified')}</p><h3>Partner updates</h3>${rows||'<p>No vendors assigned to your event yet.</p>'}${e.status==='Proposal shared'?`<div class="total-row"><span>Proposed vendor subtotal</span><strong>${money(total)}</strong></div><p class="footnote">Illustrative quote totals only. Taxes, delivery, planner and platform fees may be additional. Sharing is simulated, not a contract.</p>`:'<div class="callout">Your planner is putting together options. Switch to the Planner and Vendor demo tabs to simulate the full process.</div>'}</section>`;window.scrollTo(0,0)}
function renderPlanner(){const e=data.events.find(e=>e.id===selectedEventId)||data.events[0];if(e)selectedEventId=e.id;const requested=data.events.filter(e=>e.status==='New').length;const sent=data.events.filter(e=>e.status==='Proposal shared').length;const active=data.events.filter(e=>e.status==='Sourcing').length;const quoteCount=data.events.reduce((s,e)=>s+Object.values(e.quotes).filter(q=>q.status==='quoted').length,0);$('appMain').innerHTML=`<div class="hero-mini"><div class="overline">Planner workspace</div><h1>Good events take good teamwork.</h1><p>Review event requests, coordinate vendors and assemble one shared proposal.</p></div><div class="stats"><div class="stat"><div class="label">Total events</div><div class="number">${data.events.length}</div></div><div class="stat"><div class="label">New requests</div><div class="number">${requested}</div></div><div class="stat"><div class="label">In sourcing</div><div class="number">${active}</div></div><div class="stat"><div class="label">Proposals shared</div><div class="number">${sent}</div></div></div><div class="workspace"><div class="panel"><div class="eyebrow">YOUR EVENTS</div><h3>Event inbox</h3><p class="footnote">Select an event to open its workspace.</p><div class="list-panel">${data.events.map(ev=>`<button class="event-list-item ${ev.id===selectedEventId?'selected':''}" onclick="selectEvent('${ev.id}')"><div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(ev.title)}</strong><span class="status ${ev.status==='Proposal shared'?'shared':''}">${esc(ev.status)}</span></div><span>${esc(prettyDate(ev.date))} · ${esc(ev.city)}</span></button>`).join('')}</div></div><div class="panel">${e?plannerWorkspace(e):'<div class="empty"><b>No requests yet</b><p>Create an event from the Customer tab to start.</p></div>'}</div></div><div class="callout">💡 <b>How to test:</b> Assign suppliers → Request quotes → Switch to Vendor → Send a quote → Return here to share the proposal. All actions are simulations.</div>`}
function plannerWorkspace(e){const quotes=Object.values(e.quotes);const total=quotes.filter(q=>q.status==='quoted').reduce((a,q)=>a+Number(q.amount),0);const other=data.vendors.filter(v=>v.approved&&!e.selectedVendors.includes(v.id));return `<div class="workspace-top"><div><div class="eyebrow">${esc(e.id)} • EVENT WORKSPACE</div><h2>${esc(e.title)}</h2></div><span class="status ${e.status==='Proposal shared'?'shared':''}">${esc(e.status)}</span></div><div class="details"><span class="detail">📅 ${esc(prettyDate(e.date))}</span><span class="detail">📍 ${esc(e.city)}</span><span class="detail">👥 ${e.guests} guests</span><span class="detail">💵 ${money(e.budget)} budget</span></div><p style="font-size:13px">${esc(e.details||'No special event notes provided.')}</p><p class="footnote">Requested: ${esc(e.services.join(', ')||'Any event services')}</p><hr class="divider"/><div class="workspace-top"><h3>Vendor shortlist</h3><span class="status">${e.selectedVendors.length} assigned</span></div>${e.selectedVendors.length?e.selectedVendors.map(id=>{let v=vendor(id),q=e.quotes[id];if(!v)return '';return `<div class="quote-row"><div><strong>${esc(v.name)}</strong><small>${esc(v.category)}</small></div><span class="pill-number">${q?.status==='quoted'?money(q.amount):'—'}</span><span class="status ${q?.status||''}">${q?.status==='quoted'?'Quoted':q?.status==='declined'?'Declined':q?.status==='requested'?'Requested':'Not requested'}</span></div>`}).join(''):'<p class="footnote">No vendors selected yet. Add vendors below.</p>'}<div style="display:flex;gap:10px;flex-wrap:wrap;margin:15px 0"><select id="addVendorSelect" style="flex:1;min-width:190px" aria-label="Choose a vendor to assign"><option value="">Add another supplier...</option>${other.map(v=>`<option value="${v.id}">${esc(v.name)} — ${esc(v.category)}</option>`).join('')}</select><button class="btn btn-light btn-small" onclick="assignVendor()" ${!other.length?'disabled':''}>+ Assign</button></div><button class="btn btn-primary" onclick="requestQuotes()" ${!e.selectedVendors.length?'disabled':''}>Request pending quotes →</button><p class="footnote">Requests appear in each selected supplier's demo dashboard.</p><hr class="divider"/><h3>Customer proposal</h3><p class="footnote">${quotes.filter(q=>q.status==='quoted').length} supplier quote(s) received. Unquoted suppliers are excluded from this subtotal.</p><div class="total-row"><span>Quoted vendor subtotal</span><strong>${money(total)}</strong></div><button class="btn btn-${quotes.some(q=>q.status==='quoted')?'primary':'soft'}" ${quotes.some(q=>q.status==='quoted')?'':'disabled'} onclick="shareProposal()">${e.status==='Proposal shared'?'✓ Re-share demo proposal':'Share demo proposal with customer →'}</button><p class="footnote">This action only updates the customer's demo view. It does not send email, collect money or finalize a booking.</p>`}
function selectEvent(id){selectedEventId=id;renderPlanner()}
function assignVendor(){const id=$('addVendorSelect').value;if(!id)return notify('Choose a supplier.');const e=data.events.find(x=>x.id===selectedEventId);if(e&&!e.selectedVendors.includes(id)){e.selectedVendors.push(id);persist();renderPlanner();notify('Supplier assigned to this event.')}}
function requestQuotes(){const e=data.events.find(x=>x.id===selectedEventId);if(!e)return;let count=0;e.selectedVendors.forEach(id=>{if(!e.quotes[id]||e.quotes[id].status==='declined'){e.quotes[id]={status:'requested',amount:null,note:''};count++}});if(!count)return notify('All selected vendors already have open requests or quotes.');e.status='Sourcing';persist();renderPlanner();notify(count+' demo quote request(s) are now in the Vendor portal.')}
function shareProposal(){const e=data.events.find(x=>x.id===selectedEventId);if(!e||!Object.values(e.quotes).some(q=>q.status==='quoted'))return;e.status='Proposal shared';persist();renderPlanner();notify('Proposal visible in Customer view (no email sent).')}
function renderVendor(){const v=vendor(chosenVendorId)||data.vendors[0];chosenVendorId=v.id;const relevant=data.events.filter(e=>e.quotes[v.id]);const incoming=relevant.filter(e=>e.quotes[v.id].status==='requested');const quoted=relevant.filter(e=>e.quotes[v.id].status==='quoted');$('appMain').innerHTML=`<div class="hero-mini"><div class="overline">Supplier dashboard</div><h1>Make every booking count.</h1><p>Respond to event requests and keep planners updated in one place.</p></div><div class="panel" style="margin-bottom:20px"><div class="vendor-switch"><div><div class="eyebrow">DEMO ACCOUNT</div><h3 style="margin-bottom:0">Acting as a vendor</h3></div><select id="vendorPicker" aria-label="Choose which demo vendor to represent" onchange="chooseVendor(this.value)">${data.vendors.filter(v=>v.approved).map(opt=>`<option value="${opt.id}" ${v.id===opt.id?'selected':''}>${esc(opt.name)}</option>`).join('')}</select><span class="status">${esc(v.category)}</span></div></div><div class="stats"><div class="stat"><div class="label">All assigned events</div><div class="number">${relevant.length}</div></div><div class="stat"><div class="label">Awaiting your quote</div><div class="number">${incoming.length}</div></div><div class="stat"><div class="label">Quotes sent</div><div class="number">${quoted.length}</div></div><div class="stat"><div class="label">Starting package</div><div class="number">${money(v.price)}</div></div></div><div class="section-head"><div><div class="eyebrow">YOUR LEADS</div><h2>Quote requests</h2><p>Vendor-specific requests are generated from the planner workspace.</p></div></div>${relevant.length?relevant.map(e=>{let q=e.quotes[v.id];return `<article class="request-card"><div class="request-card-top"><div><span class="tiny-label">${esc(e.id)}</span><h3>${esc(e.title)}</h3></div><span class="status ${q.status}">${q.status==='quoted'?'Quote submitted':q.status==='declined'?'Declined':'Quote requested'}</span></div><div class="details"><span class="detail">📅 ${esc(prettyDate(e.date))}</span><span class="detail">📍 ${esc(e.city)}</span><span class="detail">👥 ${e.guests} guests</span></div><p style="font-size:12px">${esc(e.details||'No additional requirements provided.')}</p>${q.status==='requested'?`<form onsubmit="sendQuote(event,'${e.id}')" class="inline-form"><div class="input-group"><label for="quotePrice_${e.id}">Your quote (USD) *</label><input class="field" id="quotePrice_${e.id}" type="number" min="1" step="1" value="${v.price}" required /></div><div class="input-group"><label for="quoteNote_${e.id}">What's included?</label><input class="field" id="quoteNote_${e.id}" maxlength="160" placeholder="Setup, pickup, 3 hours..." /></div><button class="btn btn-primary" type="submit">Send quote →</button></form><button class="btn btn-danger btn-small" style="margin-top:10px" onclick="declineQuote('${e.id}')">Decline request</button>`:q.status==='quoted'?`<div class="callout"><b>Submitted:</b> ${money(q.amount)}${q.note?' — '+esc(q.note):''}</div>`:'<p class="footnote">You declined this request.</p>'}</article>`}).join(''):'<div class="empty"><div class="empty-icon">📥</div><b>No quote requests for this supplier.</b><p>Switch to Planner, assign this vendor to an event and click “Request pending quotes.”</p></div>'}`}
function chooseVendor(id){chosenVendorId=id;renderVendor()}
function sendQuote(ev,id){ev.preventDefault();const e=data.events.find(e=>e.id===id);if(!e)return;let n=Number($('quotePrice_'+id).value);if(n<=0)return;const note=$('quoteNote_'+id).value.trim();e.quotes[chosenVendorId]={status:'quoted',amount:n,note};persist();renderVendor();notify('Quote saved. Planner can now include it in a proposal.')}
function declineQuote(id){const e=data.events.find(e=>e.id===id);if(!e)return;e.quotes[chosenVendorId]={status:'declined',amount:null,note:''};persist();renderVendor();notify('Request marked declined.')}
function renderAdmin(){const total=data.events.length,quoted=data.events.reduce((s,e)=>s+Object.values(e.quotes).filter(q=>q.status==='quoted').length,0),pending=data.vendors.filter(v=>!v.approved).length;$('appMain').innerHTML=`<div class="hero-mini"><div class="overline">Platform operator</div><h1>One network. Full visibility.</h1><p>A starting place for vendor quality, event activity and platform health.</p></div><div class="stats"><div class="stat"><div class="label">Vendor listings</div><div class="number">${data.vendors.length}</div></div><div class="stat"><div class="label">Total events</div><div class="number">${total}</div></div><div class="stat"><div class="label">Quotes submitted</div><div class="number">${quoted}</div></div><div class="stat"><div class="label">Pending approvals</div><div class="number">${pending}</div></div></div><div class="panel"><div class="section-head"><div><div class="eyebrow">SUPPLIER DIRECTORY</div><h2>Manage vendors</h2><p>Demo listing review, categories and visibility.</p></div><button class="btn btn-light btn-small" onclick="addDemoVendor()">+ Add test vendor</button></div><div class="table-wrap"><table><thead><tr><th>Business</th><th>Category</th><th>City</th><th>From</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.vendors.map(v=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.category)}</td><td>${esc(v.city)}</td><td>${money(v.price)}</td><td><span class="status ${v.approved?'quoted':'requested'}">${v.approved?'Listed':'Hidden'}</span></td><td><button class="btn btn-soft btn-small" onclick="toggleApproved('${v.id}')">${v.approved?'Hide listing':'Approve'}</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel" style="margin-top:22px"><h3>Prototype setup</h3><p class="footnote">Everything is fictional and stored in this browser only. Reset to restore the original example event and supplier profiles.</p><button class="btn btn-danger" onclick="resetDemo()">Reset all demo data</button></div>`}
function addDemoVendor(){const id='v'+Date.now();data.vendors.push({id,name:'New Sample Rental Company',category:'Bounce Houses',city:'Raleigh, NC',price:250,icon:'🎪',bg:'linear-gradient(120deg,#e0dcfd,#f2ddf7)',description:'Example listing awaiting review.',approved:false});persist();renderAdmin();notify('Unapproved test supplier created.')}
function toggleApproved(id){const v=vendor(id);if(!v)return;v.approved=!v.approved;persist();renderAdmin();notify(v.approved?'Vendor listing approved.':'Vendor listing hidden.')}
function resetDemo(){if(!confirm('Reset all demo events, quotes, vendor changes and shortlists?'))return;localStorage.removeItem(STORAGE);data={vendors:JSON.parse(JSON.stringify(seedVendors)),events:[JSON.parse(JSON.stringify(seedEvent))]};shortlist=[];selectedEventId='EB-1001';chosenVendorId='v1';filter='All';search='';render();notify('Demo restored to its initial state.')}
setActiveRole();render();
</script>
</body>
</html>
